plugins {
	id 'net.fabricmc.fabric-loom'
}

loom {
	runs {
		configureEach {
			ideConfigGenerated = true
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet("main", project(":common"))
		}
	}

	mixin {
		useLegacyMixinAp = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	api "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

	api("dev.ftb.mods:ftb-library-fabric:${rootProject.ftb_library_version}")
	runtimeOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
}
